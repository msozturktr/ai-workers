<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-workers</title>
<link rel="icon" href="/icon.svg">
<script>
  try { document.documentElement.dataset.skin = localStorage.getItem('aw.skin') || 'modern'; } catch (e) {}
</script>
<link rel="stylesheet" href="/ui/modern.css" data-skin-css="modern">
<link rel="stylesheet" href="/ui/synthwave.css" data-skin-css="synthwave">
<link rel="stylesheet" href="/ui/apollo.css" data-skin-css="apollo">
<script>
  /* enable only the stylesheet of the remembered theme before first paint */
  for (const l of document.querySelectorAll('link[data-skin-css]')) l.disabled = l.dataset.skinCss !== document.documentElement.dataset.skin;
</script>
<style>
  #aw-toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:200; padding:7px 14px; border-radius:6px;
    font:12.5px/1.4 system-ui, sans-serif; background:#111; color:#fff; opacity:0; transition:opacity .2s; pointer-events:none; }
  #aw-toast.show { opacity:.92; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/ui/i18n.js"></script>
<script src="/ui/core.js"></script>
<script src="/ui/view-modern.js"></script>
<script src="/ui/view-synthwave.js"></script>
<script src="/ui/view-apollo.js"></script>
<script>AW.boot();</script>
</body>
</html>
