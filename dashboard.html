<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-workers · kalan kullanım</title>
<style>
  :root {
    color-scheme: light;
    --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --track:#e7e5de; --fill:#2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --track:#33332f; --fill:#3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --track:#33332f; --fill:#3987e5;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:28px 20px 56px; background:var(--plane); color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .wrap { max-width:1040px; margin:0 auto; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  h1 { font-size:19px; font-weight:650; margin:0; letter-spacing:-0.01em; }
  .sub { color:var(--muted); font-size:12.5px; }
  .bar { display:flex; align-items:center; gap:10px; margin:18px 0 22px; flex-wrap:wrap; }
  button {
    font:inherit; font-size:12.5px; padding:5px 11px; border:1px solid var(--axis);
    border-radius:7px; background:var(--surface); color:var(--ink-2); cursor:pointer;
  }
  button:hover { color:var(--ink); border-color:var(--muted); }
  .card {
    background:var(--surface); border:1px solid var(--grid); border-radius:11px;
    padding:17px 19px; margin-bottom:13px;
  }
  .hero-card { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .hero-num { font-size:52px; line-height:1; font-weight:600; letter-spacing:-0.025em; }
  .hero-lab { color:var(--ink-2); font-size:13px; margin-top:7px; }
  .kpis { display:flex; gap:28px; flex-wrap:wrap; }
  .kpi-v { font-size:23px; font-weight:600; letter-spacing:-0.015em; }
  .kpi-l { color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.055em; margin-top:3px; }
  h2 { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase;
       letter-spacing:.07em; margin:26px 0 11px; }
  .row { display:flex; align-items:center; gap:13px; padding:11px 0; border-top:1px solid var(--grid); }
  .row:first-child { border-top:0; }
  .row-name { width:118px; flex:none; font-weight:550; }
  .row-name small { display:block; font-weight:400; color:var(--muted); font-size:11px; }
  .meter { flex:1; min-width:120px; }
  .track { height:9px; border-radius:5px; background:var(--track); overflow:hidden; }
  .fill { height:100%; border-radius:5px; transition:width .35s ease; }
  .meter-cap { display:flex; justify-content:space-between; gap:10px; margin-top:5px;
               font-size:11.5px; color:var(--muted); }
  .status { flex:none; width:152px; text-align:right; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .status b { font-weight:600; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px; }
  .note { color:var(--muted); font-size:12px; margin-top:9px; }
  .warnbox { border-left:3px solid var(--warning); padding:9px 13px; background:var(--surface);
             border-radius:0 7px 7px 0; color:var(--ink-2); font-size:12.5px; margin-top:11px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:right; padding:7px 9px; border-top:1px solid var(--grid); font-variant-numeric:tabular-nums; }
  th:first-child, td:first-child { text-align:left; font-variant-numeric:normal; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .scroll { overflow-x:auto; }
  .stale { color:var(--serious); }
  footer { color:var(--muted); font-size:11.5px; margin-top:28px; }
  [hidden] { display:none !important; }
</style>

<div class="wrap">
  <header>
    <h1>ai-workers · kalan kullanım</h1>
    <span class="sub" id="asof">yükleniyor…</span>
  </header>

  <div class="bar">
    <button id="refresh">Yenile</button>
    <button id="auto">Oto-yenile: açık</button>
    <button id="theme">Tema</button>
    <button id="tbl">Tablo görünümü</button>
  </div>

  <div class="card hero-card">
    <div>
      <div class="hero-num" id="hero">—</div>
      <div class="hero-lab" id="hero-lab">en sıkı kota</div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>

  <h2>İşçi modeller — kota</h2>
  <div class="card" id="workers"></div>

  <h2>Claude (ana beyin)</h2>
  <div class="card" id="claude"></div>

  <div id="tablewrap" hidden>
    <h2>Tablo görünümü</h2>
    <div class="card scroll"><table id="table"></table></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat('tr-TR');
const n = v => (v === null || v === undefined) ? '—' : nf.format(v);

const TR = { 'session':'oturum', 'week':'hafta', 'all models':'tüm modeller',
             'week (all models)':'hafta (tüm modeller)', 'current':'' };
function trLabel(x) {
  let t = String(x || '').toLowerCase().trim();
  if (TR[t]) return TR[t];
  for (const [en, tr] of Object.entries(TR)) {
    if (en && tr) t = t.split(en).join(tr);
  }
  return t;
}

function statusOf(pct) {
  if (pct === null) return { key:'none', color:'var(--muted)', label:'bilinmiyor', icon:'○' };
  if (pct > 50)  return { key:'good',     color:'var(--good)',     label:'rahat',    icon:'●' };
  if (pct > 20)  return { key:'warning',  color:'var(--warning)',  label:'azalıyor', icon:'◆' };
  if (pct > 5)   return { key:'serious',  color:'var(--serious)',  label:'kritiğe yakın', icon:'▲' };
  return           { key:'critical', color:'var(--critical)', label:'tükeniyor', icon:'■' };
}

function meterRow(name, sub, remaining, limit, resetTxt, sourceTxt) {
  const pct = (limit && limit > 0 && remaining !== null && remaining !== undefined)
    ? Math.max(0, Math.min(100, remaining / limit * 100)) : null;
  const st = statusOf(pct);
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `
    <div class="row-name">${name}<small>${sub || ''}</small></div>
    <div class="meter">
      <div class="track"><div class="fill" style="width:${pct === null ? 0 : pct}%;
           background:${st.color}"></div></div>
      <div class="meter-cap"><span>${sourceTxt || ''}</span><span>${resetTxt ? 'sıfırlanma: ' + resetTxt : ''}</span></div>
    </div>
    <div class="status">
      <span class="dot" style="background:${st.color}"></span><b>${n(remaining)}</b> / ${n(limit)}
      <div style="color:var(--muted);font-size:11.5px">${st.icon} ${st.label}${pct !== null ? ' · %' + pct.toFixed(0) : ''}</div>
    </div>`;
  return d;
}

function meterPct(name, sub, pct, resetTxt, sourceTxt) {
  const st = statusOf(pct);
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `
    <div class="row-name">${name}<small>${sub || ''}</small></div>
    <div class="meter">
      <div class="track"><div class="fill" style="width:${pct === null ? 0 : pct}%;
           background:${st.color}"></div></div>
      <div class="meter-cap"><span>${sourceTxt || ''}</span><span>${resetTxt ? 'sıfırlanma: ' + resetTxt : ''}</span></div>
    </div>
    <div class="status">
      <span class="dot" style="background:${st.color}"></span><b>%${pct === null ? '—' : pct.toFixed(0)}</b> kaldı
      <div style="color:var(--muted);font-size:11.5px">${st.icon} ${st.label}</div>
    </div>`;
  return d;
}

let LAST = null, TIMER = null, AUTO = true;

function render(d) {
  LAST = d;
  const t = new Date(d.generated_at * 1000);
  $('#asof').textContent = t.toLocaleTimeString('tr-TR') + ' itibarıyla';

  // --- isci modeller
  const host = $('#workers');
  host.textContent = '';
  let tightest = null, notes = [];
  let reqToday = 0, tokToday = 0, failToday = 0;

  for (const w of d.workers) {
    reqToday += w.today_requests || 0;
    tokToday += (w.today_tokens_in || 0) + (w.today_tokens_out || 0);
    failToday += w.today_failed || 0;

    if (!w.ready) {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<div class="row-name">${w.provider}<small>anahtar yok</small></div>
        <div class="meter"><div class="meter-cap"><span>yapılandırılmadı</span></div></div>
        <div class="status" style="color:var(--muted)">—</div>`;
      host.appendChild(r);
      continue;
    }
    // model bazli limitli saglayici (Gemini)
    if (w.models && w.per_model_limits) {
      const head = document.createElement('div');
      head.className = 'row';
      head.innerHTML = `<div class="row-name">${w.provider}<small>${w.tier || 'model bazlı limit'}</small></div>
        <div class="meter"><div class="meter-cap"><span>${w.source}</span>
          <span>${w.today_requests} istek bugün</span></div></div>
        <div class="status" style="color:var(--muted);font-size:11.5px">${w.models.length} model</div>`;
      host.appendChild(head);
      for (const m of w.models) {
        const dq = (m.quota || {}).day_requests;
        const mq = (m.quota || {}).min_requests;
        const tq = (m.quota || {}).min_tokens;
        if (!dq) continue;
        const ft = m.free_tier;
        const cap = [
          mq ? `dk istek ${n(mq.used)}/${n(mq.limit)}` : null,
          tq ? `dk token ${n(tq.used)}/${n(tq.limit)}` : null,
          ft && ft.day_remaining !== null
            ? `ücretsizde ${n(ft.day_remaining)}/${n(ft.limits.rpd)} kalırdı` : null,
        ].filter(Boolean).join(' · ');
        if (ft && ft.exceeded) {
          notes.push(`${m.model}: ücretsiz katman limitini aşıyor (${ft.exceeded.join(', ')}) — bu kullanım ücretli`);
        }
        host.appendChild(meterRow('↳ ' + m.model.replace(/^gemini-/, ''),
          `${m.requests_today} istek bugün`, dq.remaining, dq.limit, 'günlük', cap));
        if (dq.limit > 0) {
          const pct = dq.remaining / dq.limit * 100;
          if (!tightest || pct < tightest.pct) {
            tightest = { pct, provider: `${w.provider} · ${m.model}`,
                         remaining: dq.remaining, limit: dq.limit };
          }
        }
      }
      if (w.today_failed) notes.push(`${w.provider}: ${w.today_failed} başarısız istek`);
      continue;
    }

    const q = w.quota;
    const age = w.as_of_age_sec;
    let src = w.source || '';
    if (age !== undefined && age !== null && age > 120) {
      src += ` · ${Math.round(age/60)} dk önceki ölçüm`;
    }
    if (q && q.requests) {
      const rq = q.requests;
      host.appendChild(meterRow(w.provider, `${w.today_requests} istek bugün`,
        rq.remaining, rq.limit, rq.reset, src));
      if (rq.limit > 0 && rq.remaining !== null && rq.remaining !== undefined) {
        const pct = rq.remaining / rq.limit * 100;
        if (!tightest || pct < tightest.pct) {
          tightest = { pct, provider: w.provider, remaining: rq.remaining, limit: rq.limit };
        }
      }
      if (q.tokens && q.tokens.limit) {
        host.appendChild(meterRow('', 'token penceresi', q.tokens.remaining, q.tokens.limit,
          q.tokens.reset, 'dakikalık token bütçesi'));
      }
      if (q.per_minute && q.per_minute.limit) {
        host.appendChild(meterRow('', 'dakikalık istek', q.per_minute.remaining,
          q.per_minute.limit, '60 sn', 'yerel sayaç'));
      }
    } else {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<div class="row-name">${w.provider}<small>${w.today_requests} istek bugün</small></div>
        <div class="meter"><div class="meter-cap"><span>${w.source || ''}</span></div></div>
        <div class="status"><b>${n(w.today_requests)}</b> istek
          <div style="color:var(--muted);font-size:11.5px">○ limit tanımsız</div></div>`;
      host.appendChild(r);
      if (w.note) notes.push(`${w.provider}: ${w.note}`);
    }
    if (w.credits && w.free_tier === false) {
      notes.push(`${w.provider}: kredi ${w.credits.remaining}/${w.credits.limit}`);
    }
  }
  if (notes.length) {
    const b = document.createElement('div');
    b.className = 'warnbox';
    b.innerHTML = notes.map(x => `⚠ ${x}`).join('<br>');
    host.appendChild(b);
  }

  // --- claude canli limitleri de hero yarismasina girer
  const live = (d.claude && d.claude.live) || {};
  for (const L of (live.limits || [])) {
    if (typeof L.remaining_pct === 'number') {
      if (!tightest || L.remaining_pct < tightest.pct) {
        tightest = { pct: L.remaining_pct, provider: 'Claude · ' + trLabel(L.label),
                     remaining: null, limit: null, resets: L.resets };
      }
    }
  }

  // --- hero: en sikisan kota
  if (tightest) {
    $('#hero').textContent = '%' + tightest.pct.toFixed(0);
    $('#hero').style.color = statusOf(tightest.pct).color;
    $('#hero-lab').textContent = tightest.remaining === null
      ? `en sıkı kota — ${tightest.provider}` +
        (tightest.resets ? ` · sıfırlanma ${tightest.resets}` : '')
      : `en sıkı kota — ${tightest.provider}: ${n(tightest.remaining)} / ${n(tightest.limit)} istek kaldı`;
  } else {
    $('#hero').textContent = '—';
    $('#hero-lab').textContent = 'canlı kota verisi yok';
  }

  $('#kpis').innerHTML = `
    <div><div class="kpi-v">${n(reqToday)}</div><div class="kpi-l">bugün istek</div></div>
    <div><div class="kpi-v">${n(tokToday)}</div><div class="kpi-l">bugün token</div></div>
    <div><div class="kpi-v" style="${failToday ? 'color:var(--critical)' : ''}">${n(failToday)}</div><div class="kpi-l">başarısız</div></div>`;

  // --- claude
  const c = d.claude, ch = $('#claude');
  const tt = c.totals || {};
  ch.textContent = '';

  // canli abonelik limitleri (claude -p /usage)
  if (live.pending) {
    const p = document.createElement('div');
    p.className = 'note';
    p.textContent = 'Canlı limit ölçümü alınıyor (claude -p /usage)… birkaç saniye sürer, sonraki yenilemede görünür.';
    ch.appendChild(p);
  } else if (live.ok && (live.limits || []).length) {
    const srcTxt = 'canlı · ' + (live.age_sec < 60 ? 'şimdi'
      : Math.round(live.age_sec / 60) + ' dk önce') + (live.refreshing ? ' · tazeleniyor' : '');
    for (const L of live.limits) {
      ch.appendChild(meterPct(trLabel(L.label), `%${L.used_pct} kullanıldı`,
        L.remaining_pct, L.resets, srcTxt));
    }
  } else if (live.error) {
    const e = document.createElement('div');
    e.className = 'warnbox';
    e.innerHTML = `⚠ Canlı limit alınamadı: ${live.error}`;
    ch.appendChild(e);
  }

  let html = `<div class="kpis">
      <div><div class="kpi-v">${n(tt.calls || 0)}</div><div class="kpi-l">bugün istek</div></div>
      <div><div class="kpi-v">${n(tt.out || 0)}</div><div class="kpi-l">üretilen token</div></div>
      <div><div class="kpi-v">${n(tt.cache_read || 0)}</div><div class="kpi-l">önbellek okuma</div></div>
      <div><div class="kpi-v">${n(c.today_sessions || 0)}</div><div class="kpi-l">oturum</div></div>
    </div>`;
  // canli veri varsa bayat limit olayini gostermeye gerek yok
  const q = (live.ok && (live.limits || []).length) ? null : c.last_quota_event;
  if (q) {
    const reset = new Date(q.resetsAt * 1000);
    const past = reset < new Date();
    html += `<div class="warnbox">Son limit olayı: <b>${q.rateLimitType || '?'}</b> · durum
      <b>${q.status || '?'}</b> · sıfırlanma ${reset.toLocaleString('tr-TR')}
      ${past ? '<span class="stale">(geçmiş — güncel durumu yansıtmaz)</span>' : ''}</div>`;
  }
  const spans = (live.spans || []).map(s =>
    `${s.span}: ${n(s.requests)} istek${s.sessions ? ' · ' + s.sessions + ' oturum' : ''}`).join('  ·  ');
  if (spans) html += `<div class="note">Anthropic sayımı — ${spans}</div>`;
  html += `<div class="note">${c.caveat || ''}</div>`;
  const box = document.createElement('div');
  box.innerHTML = html;
  ch.appendChild(box);

  // --- tablo gorunumu (erisilebilirlik)
  const rows = d.workers.map(w => {
    const rq = (w.quota && w.quota.requests) || {};
    let tr = `<tr><td>${w.provider}</td><td>${w.ready ? 'hazır' : 'anahtar yok'}</td>
      <td>${n(w.today_requests)}</td><td>${n(w.today_tokens_in)}</td>
      <td>${n(w.today_tokens_out)}</td><td>${n(rq.remaining)}</td>
      <td>${n(rq.limit)}</td><td>${w.source || ''}</td></tr>`;
    for (const m of (w.models || [])) {
      const dq = (m.quota || {}).day_requests || {};
      tr += `<tr><td>&nbsp;&nbsp;↳ ${m.model}</td><td>yerel sayaç</td>
        <td>${n(m.requests_today)}</td><td colspan="2">${n(m.tokens_today)} tok</td>
        <td>${n(dq.remaining)}</td><td>${n(dq.limit)}</td><td>günlük istek</td></tr>`;
    }
    return tr;
  }).join('');
  const claudeRows = (live.limits || []).map(L =>
    `<tr><td>Claude · ${trLabel(L.label)}</td><td>canlı</td><td>—</td><td>—</td><td>—</td>
      <td>%${L.remaining_pct}</td><td>%100</td><td>claude -p /usage</td></tr>`).join('');
  $('#table').innerHTML =
    `<thead><tr><th>sağlayıcı</th><th>durum</th><th>istek</th><th>giriş tok.</th>
      <th>çıkış tok.</th><th>kalan</th><th>limit</th><th>kaynak</th></tr></thead><tbody>${rows}${claudeRows}</tbody>`;

  $('#foot').textContent =
    'Groq ve OpenRouter kotaları sağlayıcıdan canlı gelir. Gemini kota bilgisi sunmadığı için '
    + 'yerel sayaçla hesaplanır (limit tanımı config.json). Claude yüzdeleri `claude -p /usage` '
    + 'çıktısından, 2 dakika önbellekle; bu makinedeki oturumlara dayanır, diğer cihazlar dahil değil.';
}

async function load() {
  try {
    const r = await fetch('/api/usage', { cache:'no-store' });
    const d = await r.json();
    if (d.error) { $('#asof').textContent = 'hata: ' + d.error; return; }
    render(d);
  } catch (e) {
    $('#asof').textContent = 'sunucuya ulaşılamadı';
  }
}

function setAuto(on) {
  AUTO = on;
  $('#auto').textContent = 'Oto-yenile: ' + (on ? 'açık' : 'kapalı');
  if (TIMER) clearInterval(TIMER);
  if (on) TIMER = setInterval(load, 20000);
}

$('#refresh').onclick = load;
$('#auto').onclick = () => setAuto(!AUTO);
$('#tbl').onclick = () => { const t = $('#tablewrap'); t.hidden = !t.hidden; };
$('#theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

load(); setAuto(true);
</script>
